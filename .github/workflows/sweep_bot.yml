name: MGC Liquidity Sweep Bot

on:
  schedule:
    # Runs every 5 minutes (GitHub's practical minimum). Timing is not exact;
    # the bot catches up on any candles it missed between runs.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-for-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sweep bot
        env:
          TOPSTEPX_USERNAME: ${{ secrets.TOPSTEPX_USERNAME }}
          TOPSTEPX_API_KEY: ${{ secrets.TOPSTEPX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sweep_bot.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "sweep-bot"
          git config user.email "sweep-bot@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet -- state.json; then
            echo "No state change, nothing to commit."
          else
            git commit -m "Update bot state [skip ci]"
            git push
          fi
